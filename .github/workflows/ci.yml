name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (workspaces)
        run: npm test

      - name: Integration tests (testcontainers — boots Postgres + Redis)
        run: npm run test:integration
